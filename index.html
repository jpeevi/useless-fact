<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Medical Fact</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, sans-serif; background: #f4f4f4; color: #222;
    }
    .card {
      width: min(100%, 620px); background: #fff; padding: 32px; border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    .subtitle { margin: 0 0 22px; color: #666; font-size: 1.1rem; }
    .meta {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; min-height: 28px;
      opacity: 1; transform: translateY(0); transition: opacity 250ms ease, transform 250ms ease;
    }
    .badge {
      display: inline-flex; align-items: center; padding: 6px 10px; border-radius: 999px;
      background: #eee; color: #444; font-size: .85rem;
    }
    .fact-container { height: 210px; overflow: hidden; }
    .fact {
      height: 100%; display: flex; align-items: center; padding: 22px; border-radius: 12px;
      background: #f8f8f8; font-size: 1.2rem; line-height: 1.6;
      opacity: 1; transform: translateY(0); transition: opacity 250ms ease, transform 250ms ease;
    }
    .fact.leaving, .meta.leaving { opacity: 0; transform: translateY(-10px); }
    .fact.entering, .meta.entering { opacity: 0; transform: translateY(10px); }
    button {
      width: 100%; margin-top: 20px; padding: 14px 18px; border: 0; border-radius: 10px;
      background: #222; color: #fff; font-size: 1rem; cursor: pointer;
      transition: transform 150ms ease, opacity 150ms ease;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { cursor: not-allowed; opacity: .6; }
    .note { margin: 14px 0 0; color: #888; font-size: .78rem; line-height: 1.4; text-align: center; }
    @media (max-width: 480px) {
      .card { padding: 24px; }
      .fact-container { height: 250px; }
      h1 { font-size: 1.7rem; }
      .fact { font-size: 1.05rem; }
    }
    @media (prefers-reduced-motion: reduce) { .fact, .meta, button { transition: none; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello Manasa,</h1>
    <p class="subtitle">here's a random medical fact</p>
    <div class="meta" id="meta">
      <span class="badge" id="subject">Loading...</span>
      <span class="badge" id="topic"></span>
    </div>
    <div class="fact-container"><div class="fact" id="fact">Loading...</div></div>
    <button id="refreshButton">Give me another medical fact</button>
    <p class="note">For study/revision only. Verify important clinical details with standard textbooks and current guidelines.</p>
  </main>
  <script>
    const DATA_URL = './medical-facts.json';
    const factElement = document.querySelector('#fact');
    const metaElement = document.querySelector('#meta');
    const subjectElement = document.querySelector('#subject');
    const topicElement = document.querySelector('#topic');
    const refreshButton = document.querySelector('#refreshButton');
    let facts = [];
    let previousFactId = null;

    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

    const getRandomFact = () => {
      if (!facts.length) return null;
      if (facts.length === 1) return facts[0];
      let selected;
      do {
        selected = facts[Math.floor(Math.random() * facts.length)];
      } while (selected.id === previousFactId);
      previousFactId = selected.id;
      return selected;
    };

    const showFact = async item => {
      factElement.classList.add('leaving');
      metaElement.classList.add('leaving');
      await wait(250);
      factElement.textContent = item.fact;
      subjectElement.textContent = item.subject;
      topicElement.textContent = item.topic;
      factElement.classList.remove('leaving');
      metaElement.classList.remove('leaving');
      factElement.classList.add('entering');
      metaElement.classList.add('entering');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        factElement.classList.remove('entering');
        metaElement.classList.remove('entering');
      }));
    };

    const nextFact = async () => {
      const item = getRandomFact();
      if (!item) return;
      refreshButton.disabled = true;
      await showFact(item);
      refreshButton.disabled = false;
    };

    const loadFacts = async () => {
      refreshButton.disabled = true;
      try {
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
        facts = await response.json();
        if (!Array.isArray(facts) || !facts.length) throw new Error('Invalid or empty dataset');
        await nextFact();
      } catch (error) {
        factElement.textContent = "Couldn't load medical-facts.json. Make sure it is beside index.html.";
        subjectElement.textContent = 'Error';
        topicElement.textContent = '';
        console.error(error);
      } finally {
        refreshButton.disabled = false;
      }
    };

    refreshButton.addEventListener('click', nextFact);
    loadFacts();
  </script>
</body>
</html>

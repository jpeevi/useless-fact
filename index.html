<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Useless Fact</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .card {
      width: min(100%, 560px);
      background: #fff;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #666;
      font-size: 1.1rem;
    }

    .fact-container {
      height: 180px;
      overflow: hidden;
    }

    .fact {
      height: 100%;
      display: flex;
      align-items: center;
      padding: 20px;
      border-radius: 12px;
      background: #f8f8f8;
      font-size: 1.2rem;
      line-height: 1.6;

      opacity: 1;
      transform: translateY(0);

      transition:
        opacity 250ms ease,
        transform 250ms ease;
    }

    .fact.leaving {
      opacity: 0;
      transform: translateY(-10px);
    }

    .fact.entering {
      opacity: 0;
      transform: translateY(10px);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px 18px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition:
        transform 150ms ease,
        opacity 150ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    @media (max-width: 480px) {
      .card {
        padding: 24px;
      }

      .fact-container {
        height: 220px;
      }

      h1 {
        font-size: 1.7rem;
      }

      .fact {
        font-size: 1.05rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .fact,
      button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Hello Manasa,</h1>

    <p class="subtitle">
      here's a useless fact
    </p>

    <div class="fact-container">
      <div class="fact" id="fact">
        Loading...
      </div>
    </div>

    <button id="refreshButton">
      Give me another useless fact
    </button>
  </main>

  <script>
    const API_URL =
      "https://uselessfacts.jsph.pl/api/v2/facts/random?language=en";

    const factElement = document.querySelector("#fact");
    const refreshButton = document.querySelector("#refreshButton");

    const wait = (ms) =>
      new Promise(resolve => setTimeout(resolve, ms));

    const changeFact = async (text) => {
      factElement.classList.add("leaving");

      await wait(250);

      factElement.textContent = text;

      factElement.classList.remove("leaving");
      factElement.classList.add("entering");

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          factElement.classList.remove("entering");
        });
      });
    };

    const loadFact = async () => {
      refreshButton.disabled = true;

      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }

        const data = await response.json();

        await changeFact(data.text);
      } catch (error) {
        await changeFact(
          "Couldn't load a useless fact. Try again."
        );

        console.error(error);
      } finally {
        refreshButton.disabled = false;
      }
    };

    refreshButton.addEventListener("click", loadFact);

    loadFact();
  </script>
</body>
</html>
